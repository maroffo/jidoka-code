services:
  web:
    build: .
    # Finish the in-flight model call and checkpoint the review before shutdown.
    stop_grace_period: 17m
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      JIDOKA_REPOS: ${JIDOKA_REPOS:-}
      JIDOKA_PROVIDER_URL: ${JIDOKA_PROVIDER_URL:?set the full provider URL}
      JIDOKA_REVIEW_BUDGET_CENTS: ${JIDOKA_REVIEW_BUDGET_CENTS:-}
      JIDOKA_MODEL: ${JIDOKA_MODEL:?set the model name}
      JIDOKA_GITHUB_TOKEN: ${JIDOKA_GITHUB_TOKEN:-}
      JIDOKA_REVIEWER_TOKEN: ${JIDOKA_REVIEWER_TOKEN:-}
      JIDOKA_BOT_TOKEN: ${JIDOKA_BOT_TOKEN:-}
      JIDOKA_API_KEY: ${JIDOKA_API_KEY:-}
    volumes:
      - reviews:/data
volumes:
  reviews:
