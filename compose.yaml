services:
  web:
    build: .
    # Allow the bounded GitHub, scanner and two model calls of the active job to finish.
    stop_grace_period: 3m30s
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      JIDOKA_REPOS: ${JIDOKA_REPOS:?set the allowed public repositories}
      JIDOKA_PROVIDER_URL: ${JIDOKA_PROVIDER_URL:?set the full provider URL}
      JIDOKA_MODEL: ${JIDOKA_MODEL:?set the model name}
      JIDOKA_API_KEY: ${JIDOKA_API_KEY:-}
    volumes:
      - reviews:/data
volumes:
  reviews:
