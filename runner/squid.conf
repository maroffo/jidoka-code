http_port 3128
acl tunnel method CONNECT
acl tls port 443
acl google dstdomain -n aiplatform.googleapis.com aiplatform.us.rep.googleapis.com aiplatform.eu.rep.googleapis.com us-aiplatform.googleapis.com eu-aiplatform.googleapis.com oauth2.googleapis.com sts.googleapis.com iamcredentials.googleapis.com cloudresourcemanager.googleapis.com
http_access allow tunnel tls google
http_access deny all
cache deny all
access_log none
cache_store_log none
cache_log /dev/stderr
pid_filename none
logfile_rotate 0
pinger_enable off
